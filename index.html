<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>By-biw-shop - ร้านค้าออนไลน์</title>
    <!-- โหลด Font Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- โหลด FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #060d19;
            color: #ffffff;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Navbar */
        nav {
            background: rgba(10, 22, 41, 0.95);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a2f4c;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0088ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            background: #0088ff;
            color: white;
            padding: 8px;
            border-radius: 50%;
            font-size: 1.2rem;
        }

        /* Hero Banner */
        .hero {
            background: radial-gradient(circle at center, #0e274e 0%, #060d19 100%);
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #112540;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: #00d2ff;
        }

        .hero p {
            color: #8fa0b5;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .btn-main {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.4);
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.7);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Category Bar */
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .cat-card {
            background: #0d1e36;
            border: 1px solid #1c355a;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .cat-card:hover, .cat-card.active {
            background: #0066ff;
            border-color: #00d2ff;
        }

        .cat-card i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .cat-card h4 {
            font-size: 0.9rem;
        }
